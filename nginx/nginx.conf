# ═══════════════════════════════════════════════════════════════
# Nginx Reverse Proxy — Micro Frontend Production
# ═══════════════════════════════════════════════════════════════
#
# Berfungsi sebagai:
# 1. SSL Termination (HTTPS)
# 2. Load balancing ke multiple replica per service
# 3. Rate limiting
# 4. Static asset caching
# 5. Routing ke service yang tepat

events {
  worker_connections 1024;
  multi_accept on;
  use epoll;
}

http {
  # ── Basic Settings ──
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_tokens off;

  # ── MIME Types ──
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ── Logging ──
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main;
  error_log /var/log/nginx/error.log warn;

  # ── Rate Limiting ──
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=static:10m rate=100r/s;

  # ── Gzip Compression ──
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

  # ── Upstream Services ──
  upstream shell_app {
    least_conn;
    server shell-app:3000;
    keepalive 32;
  }

  upstream mfe_react {
    least_conn;
    server mfe-react:3001;
    keepalive 16;
  }

  upstream mfe_vue {
    least_conn;
    server mfe-vue:3002;
    keepalive 16;
  }

  
  upstream mfe-profile {
    server mfe-profile:3004;
    keepalive 16;
  }


  upstream home {
    server home:3000;
    keepalive 16;
  }

upstream mfe_angular {
    least_conn;
    server mfe-angular:3003;
    keepalive 16;
  }

  # ── HTTP → HTTPS Redirect ──
  server {
    listen 80;
    server_name yourdomain.com;
    return 301 https://$server_name$request_uri;
  }

  # ── HTTPS Server ──
  server {
    listen 443 ssl http2;
    server_name yourdomain.com;

    # SSL (ganti dengan sertifikat yang valid)
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Main App (Shell) ──
    location / {
      proxy_pass http://shell_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;

      # SSR streaming support
      proxy_buffering off;
      proxy_cache off;
    }

    # ── React MFE Assets ──
    location /mfe/react/ {
      proxy_pass http://mfe_react/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;

      # Static assets cache
      location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
      }

      # remoteEntry.js — no cache
      location ~* remoteEntry\.js$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
      }
    }

    # ── Vue MFE Assets ──
    location /mfe/vue/ {
      proxy_pass http://mfe_vue/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;

      location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
      }

      location ~* remoteEntry\.js$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
      }
    }

    # ── Angular MFE Assets ──
    
  location /mfe/mfe-profile/ {
    proxy_pass http://mfe-profile/;
    add_header Cache-Control "public, max-age=3600";
  }


  location /mfe/home/ {
    proxy_pass http://home/;
    add_header Cache-Control "public, max-age=3600";
  }

location /mfe/angular/ {
      proxy_pass http://mfe_angular/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;

      location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
      }

      location ~* remoteEntry\.js$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
      }
    }

    # ── API Gateway ──
    location /api/ {
      limit_req zone=api burst=10 nodelay;
      proxy_pass http://api:4000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Health Check ──
    location /health {
      access_log off;
      return 200 "healthy\n";
      add_header Content-Type text/plain;
    }

    # ── Deny access to hidden files ──
    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
    }
  }
}
