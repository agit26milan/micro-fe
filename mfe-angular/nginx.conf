server {
  listen 3003;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  # CORS — izinkan shell app mengakses
  add_header Access-Control-Allow-Origin "*" always;
  add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
  add_header Access-Control-Allow-Headers "Content-Type" always;

  # Cache static assets agresif
  # NOTE: add_header di level location TIDAK inherit dari server level.
  # Setiap location harus explicitly set CORS headers dengan 'always'.
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
  }

  # remoteEntry.js — NO cache, selalu fresh
  location ~* remoteEntry\.js$ {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
